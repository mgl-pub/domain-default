<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>域名联系页面 | 专业展示</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4edf5 100%);
            color: #333;
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            max-width: 1200px;
            width: 100%;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            padding: 40px;
            position: relative;
            overflow: hidden;
        }
        
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(to right, #4a6ee0, #6a8cee);
        }
        
        header {
            text-align: center;
            margin-bottom: 50px;
            position: relative;
        }
        
        .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #4a6ee0, #6a8cee);
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 15px rgba(74, 110, 224, 0.2);
        }
        
        .logo i {
            font-size: 2.5rem;
            color: white;
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 15px;
            font-size: 2.5rem;
            font-weight: 600;
        }
        
        .subtitle {
            color: #6c757d;
            font-size: 1.1rem;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.7;
        }
        
        .domains-section {
            margin-bottom: 50px;
        }
        
        h2 {
            color: #2c3e50;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid #f0f2f5;
            font-size: 1.6rem;
            display: flex;
            align-items: center;
        }
        
        h2 i {
            margin-right: 12px;
            color: #4a6ee0;
        }
        
        .domain-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        
        .domain-item {
            background: white;
            padding: 25px 20px;
            border-radius: 12px;
            text-align: center;
            transition: all 0.3s ease;
            border: 1px solid #eaeaea;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.03);
            position: relative;
            overflow: hidden;
        }
        
        .domain-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            border-color: #4a6ee0;
        }
        
        .domain-icon {
            width: 60px;
            height: 60px;
            background: #f8f9fa;
            border-radius: 50%;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #4a6ee0;
            font-size: 1.5rem;
            border: 1px solid #eaeaea;
        }
        
        .domain-name {
            font-weight: 600;
            color: #2c3e50;
            font-size: 1.3rem;
            margin-bottom: 8px;
        }
        
        .domain-status {
            display: inline-block;
            padding: 5px 12px;
            background: #e8f5e9;
            color: #2e7d32;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }
        
        .contact-section {
            margin-bottom: 40px;
        }
        
        .contact-methods {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
        }
        
        .contact-item {
            background: white;
            padding: 30px 25px;
            border-radius: 12px;
            text-align: center;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.03);
            border: 1px solid #f0f2f5;
        }
        
        .contact-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        }
        
        .contact-icon {
            width: 70px;
            height: 70px;
            background: #f8f9fa;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #4a6ee0;
            font-size: 1.8rem;
            border: 1px solid #eaeaea;
        }
        
        .contact-label {
            font-weight: 600;
            margin-bottom: 12px;
            color: #2c3e50;
            font-size: 1.2rem;
        }
        
        .contact-value {
            color: #555;
            font-size: 1.1rem;
        }
        
        .contact-note {
            text-align: center;
            margin-top: 30px;
            color: #6c757d;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid #4a6ee0;
        }
        
        footer {
            text-align: center;
            margin-top: 50px;
            color: #6c757d;
            font-size: 0.95rem;
            border-top: 1px solid #eee;
            padding-top: 25px;
        }
        
        .footer-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
        }
        
        .footer-links a {
            color: #4a6ee0;
            text-decoration: none;
            transition: color 0.3s;
        }
        
        .footer-links a:hover {
            color: #3a5ec0;
            text-decoration: underline;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 25px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .domain-list {
                grid-template-columns: 1fr;
            }
            
            .contact-methods {
                grid-template-columns: 1fr;
            }
            
            .footer-links {
                flex-direction: column;
                gap: 10px;
            }
        }
        
        /* 动画效果 */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .domain-item, .contact-item {
            animation: fadeInUp 0.5s ease forwards;
            opacity: 0;
        }
        
        .domain-item:nth-child(1) { animation-delay: 0.1s; }
        .domain-item:nth-child(2) { animation-delay: 0.2s; }
        .domain-item:nth-child(3) { animation-delay: 0.3s; }
        .domain-item:nth-child(4) { animation-delay: 0.4s; }
        .domain-item:nth-child(5) { animation-delay: 0.5s; }
        .domain-item:nth-child(6) { animation-delay: 0.6s; }
        
        .contact-item:nth-child(1) { animation-delay: 0.7s; }
        .contact-item:nth-child(2) { animation-delay: 0.8s; }
        .contact-item:nth-child(3) { animation-delay: 0.9s; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <i class="fas fa-globe"></i>
            </div>
            <h1>域名联系页面</h1>
            <p class="subtitle">以下域名均属于同一所有者，如需业务合作、技术交流或其他事宜，请通过下方联系方式与我取得联系</p>
        </header>
        
        <section class="domains-section">
            <h2><i class="fas fa-list"></i> 我的域名</h2>
            <div class="domain-list">
                <div class="domain-item">
                    <div class="domain-icon">
                        <i class="fas fa-globe-americas"></i>
                    </div>
                    <div class="domain-name">deepmn.com</div>
                    <div class="domain-status">已注册</div>
                </div>
                <div class="domain-item">
                    <div class="domain-icon">
                        <i class="fas fa-briefcase"></i>
                    </div>
                    <div class="domain-name">chipmn.com</div>
                    <div class="domain-status">已注册</div>
                </div>
                <div class="domain-item">
                    <div class="domain-icon">
                        <i class="fas fa-laptop-code"></i>
                    </div>
                    <div class="domain-name">xyzoi.com</div>
                    <div class="domain-status">已注册</div>
                </div>
                <div class="domain-item">
                    <div class="domain-icon">
                        <i class="fas fa-rocket"></i>
                    </div>
                    <div class="domain-name">worldoi.com</div>
                    <div class="domain-status">已注册</div>
                </div>
                <div class="domain-item">
                    <div class="domain-icon">
                        <i class="fas fa-lightbulb"></i>
                    </div>
                    <div class="domain-name">mgl.today</div>
                    <div class="domain-status">已注册</div>
                </div>
                <div class="domain-item">
                    <div class="domain-icon">
                        <i class="fas fa-palette"></i>
                    </div>
                    <div class="domain-name">mnai.chat</div>
                    <div class="domain-status">已注册</div>
                </div>
            </div>
        </section>
        
        <section class="contact-section">
            <h2><i class="fas fa-address-card"></i> 联系方式</h2>
            <div class="contact-methods">
                <div class="contact-item">
                    <div class="contact-icon">
                        <i class="fas fa-envelope"></i>
                    </div>
                    <div class="contact-label">电子邮件</div>
                    <div class="contact-value">contact@deepmn.com</div>
                </div>
                <div class="contact-item">
                    <div class="contact-icon">
                        <i class="fas fa-phone-alt"></i>
                    </div>
                    <div class="contact-label">电话</div>
                    <div class="contact-value">null</div>
                </div>
                <div class="contact-item">
                    <div class="contact-icon">
                        <i class="fab fa-weixin"></i>
                    </div>
                    <div class="contact-label">微信</div>
                    <div class="contact-value">none</div>
                </div>
            </div>
            <div class="contact-note">
                <i class="fas fa-info-circle"></i> 请优先使用电子邮件联系，我会在24小时内回复您。
            </div>
        </section>
        
        <footer>
            <p>© 2023 版权所有 | 最后更新: 2023年11月</p>
            <div class="footer-links">
                <a href="#">隐私政策</a>
                <a href="#">使用条款</a>
                <a href="#">网站地图</a>
            </div>
        </footer>
    </div>

    <script>
        // 添加简单的交互效果
        document.addEventListener('DOMContentLoaded', function() {
            const domainItems = document.querySelectorAll('.domain-item');
            
            domainItems.forEach(item => {
                item.addEventListener('click', function() {
                    this.style.transform = 'translateY(-5px) scale(1.02)';
                    setTimeout(() => {
                        this.style.transform = 'translateY(-5px)';
                    }, 150);
                });
            });
            
            // 添加滚动动画
            const observerOptions = {
                threshold: 0.1,
                rootMargin: '0px 0px -50px 0px'
            };
            
            const observer = new IntersectionObserver(function(entries) {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.style.opacity = '1';
                        entry.target.style.transform = 'translateY(0)';
                    }
                });
            }, observerOptions);
            
            const animatedElements = document.querySelectorAll('.domain-item, .contact-item');
            animatedElements.forEach(el => {
                observer.observe(el);
            });
        });
    </script>
</body>
</html>
